name: Sunsang24 Auto Scraper

on:
  schedule:
    - cron: '0 */1 * * *' # 1시간마다 자동 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests beautifulsoup4 supabase

      - name: 스크래퍼 실행 및 Supabase DB 저장
        run: |
          python batch_collector.py
